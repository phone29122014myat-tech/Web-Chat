<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Web Chat App with Friends</title>

  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #e5ddd5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { width: 100%; max-width: 450px; height: 90vh; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; overflow: hidden; }
    
    /* Header Bar */
    .header { background: #075e54; color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
    .header-info { display: flex; flex-direction: column; }
    .user-name { font-weight: bold; font-size: 16px; }
    .user-id-box { font-size: 12px; opacity: 0.9; margin-top: 3px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .btn-copy { background: rgba(255,255,255,0.2); border: none; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; cursor: pointer; }
    .header-actions { display: flex; gap: 4px; align-items: center; }
    .btn-top { background: #128c7e; color: white; border: none; padding: 6px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .btn-public { background: #008cba; color: white; border: none; padding: 6px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; }
    .btn-logout { background: #dc3545; color: white; border: none; padding: 6px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    
    /* Search & Friends Panel */
    .panel-box { background: #f0f0f0; padding: 10px 15px; border-bottom: 1px solid #ccc; max-height: 300px; overflow-y: auto; }
    .search-input-group { display: flex; gap: 8px; margin-bottom: 8px; }
    .panel-box input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
    .panel-box button { padding: 8px 12px; background: #075e54; color: white; border: none; border-radius: 6px; cursor: pointer; }
    
    .result-card { background: white; padding: 8px 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; margin-top: 5px; }
    .btn-add-friend { background: #25D366; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-accept { background: #28a745; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .btn-reject { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    
    .friend-item { background: white; padding: 8px 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; cursor: pointer; border: 1px solid #ddd; }
    .friend-item:hover { background: #f9f9f9; }

    /* Chat Target Status Bar */
    .chat-header-bar { background: #128c7e; color: white; padding: 10px 15px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .chat-header-bar.public-mode { background: #008cba; }
    .btn-close-chat { background: transparent; border: 1px solid white; color: white; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }

    /* Chat Area */
    .chat-area-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #efeae2; }
    .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    
    /* Message Box Style */
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; word-wrap: break-word; position: relative; }
    .msg-sent { align-self: flex-end; background: #dcf8c6; }
    .msg-received { align-self: flex-start; background: white; }
    .msg-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 3px; }
    .msg-sender { font-size: 11px; font-weight: bold; color: #075e54; }
    .btn-delete-msg { background: transparent; border: none; color: #888; cursor: pointer; font-size: 12px; padding: 0 2px; }
    .btn-delete-msg:hover { color: #dc3545; }
    
    .input-box { display: flex; padding: 10px; background: #f0f0f0; border-top: 1px solid #ccc; }
    .input-box input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
    .input-box button { margin-left: 8px; padding: 10px 18px; background: #128c7e; color: white; border: none; border-radius: 20px; cursor: pointer; }
    
    /* Login Screen & Blank State */
    .login-container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; gap: 15px; text-align: center; padding: 20px; }
    .btn-login { background: #4285f4; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; }
    .empty-state { flex: 1; display: flex; justify-content: center; align-items: center; color: #888; font-size: 14px; text-align: center; padding: 20px; }
    
    .hidden { display: none !important; }
    .loading { font-size: 14px; color: #666; }
    .section-title { font-size: 12px; font-weight: bold; color: #444; margin: 8px 0 4px 0; border-bottom: 1px solid #ddd; padding-bottom: 3px; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Login Screen -->
    <div id="login-screen" class="login-container">
      <h2>Web Chat App သို့ ကြိုဆိုပါသည်</h2>
      <button id="login-btn" class="btn-login">Sign in with Google</button>
      <div id="status-text" class="loading"></div>
    </div>

    <!-- Main App Screen -->
    <div id="chat-screen" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
      
      <!-- Top Navigation Header -->
      <div class="header">
        <div class="header-info">
          <span id="user-name" class="user-name">User</span>
          <div class="user-id-box" id="copy-id-btn" title="Click to Copy">
            <span>ID: <strong id="user-myanmar-id">------</strong></span>
            <button class="btn-copy">Copy</button>
          </div>
        </div>
        <div class="header-actions">
          <button id="public-room-btn" class="btn-public">🌐 Public</button>
          <button id="toggle-search-btn" class="btn-top">🔍 ရှာရန်</button>
          <button id="toggle-friends-btn" class="btn-top">👥 သူငယ်ချင်း</button>
          <button id="logout-btn" class="btn-logout">ထွက်</button>
        </div>
      </div>

      <!-- ID Search Panel -->
      <div id="search-section" class="panel-box hidden">
        <div class="section-title">သူငယ်ချင်း ID ဖြင့် ရှာရန်</div>
        <div class="search-input-group">
          <input type="text" id="search-id-input" placeholder="မြန်မာ ID ရိုက်ပါ..." />
          <button id="find-user-btn">ရှာပါ</button>
        </div>
        <div id="search-result-area"></div>
      </div>

      <!-- Friends List Panel -->
      <div id="friends-section" class="panel-box hidden">
        <div class="section-title" style="color: #d9534f;">📥 လက်ခံရန်ရှိသော တောင်းဆိုချက်များ</div>
        <div id="pending-requests-area">မရှိသေးပါ။</div>

        <div class="section-title">👥 ကျွန်ုပ်၏ သူငယ်ချင်းစာရင်း</div>
        <div id="friends-list-area">သူငယ်ချင်း မရှိသေးပါ။</div>
      </div>

      <!-- Initial Empty State Message -->
      <div id="empty-state-msg" class="empty-state">
        💬 "Public Chat" ကို နှိပ်၍ လူတိုင်းနှင့် စကားပြောပါ သို့မဟုတ် "သူငယ်ချင်း" စာရင်းမှ သီးသန့် ပြောပါ။
      </div>

      <!-- Chat Section -->
      <div id="chat-wrapper" class="chat-area-container hidden">
        <div id="chat-header-bar" class="chat-header-bar">
          <span id="chat-target-text">Chatting...</span>
          <button id="close-chat-btn" class="btn-close-chat">✕ ပိတ်မည်</button>
        </div>

        <div id="chat-box" class="chat-box"></div>

        <div class="input-box">
          <input type="text" id="message-input" placeholder="စာရိုက်ပါ..." />
          <button id="send-btn">Send</button>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion, arrayRemove, collection, addDoc, deleteDoc, query, where, getDocs, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD8PiDczKyJPrQdwyB2EmjlUdFOnr6ACVc",
      authDomain: "chat-6db74.firebaseapp.com",
      projectId: "chat-6db74",
      storageBucket: "chat-6db74.firebasestorage.app",
      messagingSenderId: "944161921075",
      appId: "1:944161921075:web:004f9c4026ebbb0a05ab46",
      measurementId: "G-M0JRKBPPPR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let myMyanmarId = "";
    let activeChatRoomId = null;
    let unsubscribeListener = null;

    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userNameSpan = document.getElementById('user-name');
    const userMyanmarIdSpan = document.getElementById('user-myanmar-id');
    const copyIdBtn = document.getElementById('copy-id-btn');
    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const statusText = document.getElementById('status-text');

    const publicRoomBtn = document.getElementById('public-room-btn');
    const toggleSearchBtn = document.getElementById('toggle-search-btn');
    const toggleFriendsBtn = document.getElementById('toggle-friends-btn');
    const searchSection = document.getElementById('search-section');
    const friendsSection = document.getElementById('friends-section');
    const searchIdInput = document.getElementById('search-id-input');
    const findUserBtn = document.getElementById('find-user-btn');
    const searchResultArea = document.getElementById('search-result-area');
    const friendsListArea = document.getElementById('friends-list-area');
    const pendingRequestsArea = document.getElementById('pending-requests-area');
    
    const emptyStateMsg = document.getElementById('empty-state-msg');
    const chatWrapper = document.getElementById('chat-wrapper');
    const chatHeaderBar = document.getElementById('chat-header-bar');
    const chatTargetText = document.getElementById('chat-target-text');
    const closeChatBtn = document.getElementById('close-chat-btn');

    function generateMyanmarId() {
      const chars = "ကခဂဃငစဆဇဈညဋဌဍဎဏတထဒဓနပဖဗဘမယရလဝသဟဠအ၀၁၂၃၄၅၆၇၈၉";
      let result = "";
      for (let i = 0; i < 10; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    async function setupUserProfile(user) {
      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);

      if (userSnap.exists()) {
        myMyanmarId = userSnap.data().myanmarId;
      } else {
        myMyanmarId = generateMyanmarId();
        await setDoc(userRef, {
          uid: user.uid,
          displayName: user.displayName || 'Anonymous',
          email: user.email,
          myanmarId: myMyanmarId,
          friends: [],
          pendingRequests: [],
          createdAt: serverTimestamp()
        });
      }
      userMyanmarIdSpan.textContent = myMyanmarId;
      loadFriendsAndRequests();
    }

    publicRoomBtn.addEventListener('click', () => {
      activeChatRoomId = "public_room_global";
      chatTargetText.textContent = "🌐 Public Chat Room (အများသုံး စကားပြောခန်း)";
      chatHeaderBar.classList.add('public-mode');
      
      friendsSection.classList.add('hidden');
      searchSection.classList.add('hidden');
      emptyStateMsg.classList.add('hidden');
      chatWrapper.classList.remove('hidden');

      loadMessages();
    });

    toggleSearchBtn.addEventListener('click', () => {
      searchSection.classList.toggle('hidden');
      friendsSection.classList.add('hidden');
      searchResultArea.innerHTML = '';
    });

    toggleFriendsBtn.addEventListener('click', () => {
      friendsSection.classList.toggle('hidden');
      searchSection.classList.add('hidden');
      loadFriendsAndRequests();
    });

    findUserBtn.addEventListener('click', async () => {
      const targetId = searchIdInput.value.trim();
      searchResultArea.innerHTML = '';

      if (!targetId) {
        alert("မြန်မာ ID ရိုက်ထည့်ပါ");
        return;
      }
      if (targetId === myMyanmarId) {
        alert("မိမိ၏ ID ကို ရှာ၍မရပါ");
        return;
      }

      const q = query(collection(db, "users"), where("myanmarId", "==", targetId));
      const querySnapshot = await getDocs(q);

      if (querySnapshot.empty) {
        searchResultArea.innerHTML = `<div style="color:red; font-size:12px;">ဒီ ID နဲ့ User ရှာမတွေ့ပါ။</div>`;
      } else {
        querySnapshot.forEach((docSnap) => {
          const targetUser = docSnap.data();
          
          const card = document.createElement('div');
          card.className = 'result-card';
          card.innerHTML = `
            <div>
              <strong>${targetUser.displayName}</strong><br/>
              <small style="color:#666;">ID: ${targetUser.myanmarId}</small>
            </div>
            <button class="btn-add-friend" id="send-req-btn">➕ Request ပို့မည်</button>
          `;
          searchResultArea.appendChild(card);

          document.getElementById('send-req-btn').addEventListener('click', () => {
            sendFriendRequest(targetUser);
          });
        });
      }
    });

    // သူငယ်ချင်း တောင်းဆိုချက် ပို့ခြင်း
    async function sendFriendRequest(targetUser) {
      try {
        const targetRef = doc(db, "users", targetUser.uid);
        const targetSnap = await getDoc(targetRef);
        
        if (targetSnap.exists()) {
          const data = targetSnap.data();
          const friends = data.friends || [];
          const pending = data.pendingRequests || [];

          // အရင်ကတည်းက သူငယ်ချင်းဖြစ်ပြီးသားလား စစ်ဆေးရန်
          if (friends.some(f => f.uid === currentUser.uid)) {
            alert("ဒီသူနဲ့က သူငယ်ချင်းဖြစ်ပြီးသားပါ။");
            return;
          }
          // Request ပို့ပြီးသားလား စစ်ဆေးရန်
          if (pending.some(p => p.uid === currentUser.uid)) {
            alert("ဒီသူဆီကို Request ပို့ပြီးသား ဖြစ်ပါတယ်။");
            return;
          }

          await updateDoc(targetRef, {
            pendingRequests: arrayUnion({
              uid: currentUser.uid,
              displayName: currentUser.displayName || 'Anonymous',
              myanmarId: myMyanmarId
            })
          });
          alert(`${targetUser.displayName} ထံသို့ သူငယ်ချင်း တောင်းဆိုချက် (Request) ပို့ပြီးပါပြီ!`);
          searchSection.classList.add('hidden');
        }
      } catch (err) {
        alert("Request ပို့၍ မရပါ: " + err.message);
      }
    }

    // သူငယ်ချင်းနှင့် Request များကို Load လုပ်ရန်
    async function loadFriendsAndRequests() {
      if (!currentUser) return;
      const userRef = doc(db, "users", currentUser.uid);
      const userSnap = await getDoc(userRef);

      if (userSnap.exists()) {
        const userData = userSnap.data();
        const friends = userData.friends || [];
        const pendingRequests = userData.pendingRequests || [];

        // 1. Pending Requests များကို ပြရန်
        pendingRequestsArea.innerHTML = '';
        if (pendingRequests.length === 0) {
          pendingRequestsArea.innerHTML = '<div style="font-size:12px; color:#666; margin-bottom:8px;">မရှိသေးပါ။</div>';
        } else {
          pendingRequests.forEach(req => {
            const item = document.createElement('div');
            item.className = 'result-card';
            item.innerHTML = `
              <div>
                <strong>${req.displayName}</strong><br/>
                <small style="color:#666;">ID: ${req.myanmarId}</small>
              </div>
              <div style="display:flex; gap:4px;">
                <button class="btn-accept" data-uid="${req.uid}">လက်ခံမည်</button>
                <button class="btn-reject" data-uid="${req.uid}">ငြင်းပယ်</button>
              </div>
            `;
            
            item.querySelector('.btn-accept').addEventListener('click', () => acceptRequest(req));
            item.querySelector('.btn-reject').addEventListener('click', () => rejectRequest(req));
            
            pendingRequestsArea.appendChild(item);
          });
        }

        // 2. Friends List များကို ပြရန်
        friendsListArea.innerHTML = '';
        if (friends.length === 0) {
          friendsListArea.innerHTML = '<div style="font-size:12px; color:#666;">သူငယ်ချင်း မရှိသေးပါ။ ID ဖြင့် ရှာပြီး Add ပါ။</div>';
          return;
        }

        friends.forEach(friend => {
          const item = document.createElement('div');
          item.className = 'friend-item';
          item.innerHTML = `
            <div>
              <strong>${friend.displayName}</strong><br/>
              <small style="color:#666;">ID: ${friend.myanmarId}</small>
            </div>
            <span style="font-size:12px; color:#128c7e; font-weight:bold;">စကားပြောမည် 💬</span>
          `;
          item.addEventListener('click', () => {
            startPrivateChat(friend);
          });
          friendsListArea.appendChild(item);
        });
      }
    }

    // Request ကို လက်ခံခြင်း (Accept)
    async function acceptRequest(reqUser) {
      try {
        const myRef = doc(db, "users", currentUser.uid);
        const senderRef = doc(db, "users", reqUser.uid);

        // ကိုယ့်ရဲ့ friends စာရင်းထဲထည့်၊ pendingRequests ထဲက ဖယ်
        await updateDoc(myRef, {
          friends: arrayUnion({
            uid: reqUser.uid,
            displayName: reqUser.displayName,
            myanmarId: reqUser.myanmarId
          }),
          pendingRequests: arrayRemove(reqUser)
        });

        // သူတို့ရဲ့ friends စာရင်းထဲမှာလည်း ကိုယ့်ကိုထည့်ပေးရန်
        await updateDoc(senderRef, {
          friends: arrayUnion({
            uid: currentUser.uid,
            displayName: currentUser.displayName || 'Anonymous',
            myanmarId: myMyanmarId
          })
        });

        alert(`${reqUser.displayName} နှင့် သူငယ်ချင်း ဖြစ်သွားပါပြီ!`);
        loadFriendsAndRequests();
      } catch (err) {
        alert("လက်ခံ၍ မရပါ: " + err.message);
      }
    }

    // Request ကို ငြင်းပယ်ခြင်း (Reject)
    async function rejectRequest(reqUser) {
      try {
        const myRef = doc(db, "users", currentUser.uid);
        await updateDoc(myRef, {
          pendingRequests: arrayRemove(reqUser)
        });
        alert("တောင်းဆိုချက်ကို ငြင်းပယ်လိုက်ပါပြီ။");
        loadFriendsAndRequests();
      } catch (err) {
        alert("လုပ်ဆောင်၍ မရပါ: " + err.message);
      }
    }

    function startPrivateChat(targetUser) {
      const roomIds = [currentUser.uid, targetUser.uid].sort();
      activeChatRoomId = `direct_${roomIds[0]}_${roomIds[1]}`;

      chatTargetText.textContent = `Private Chat: ${targetUser.displayName}`;
      chatHeaderBar.classList.remove('public-mode');
      
      friendsSection.classList.add('hidden');
      searchSection.classList.add('hidden');
      emptyStateMsg.cl
